<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#764ba2">
  <title>登录 - 任务平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --safe-top:    env(safe-area-inset-top,    0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { -webkit-tap-highlight-color: transparent; }
    html, body {
      min-height: 100vh; min-height: 100dvh;
      background: linear-gradient(160deg, #667eea 0%, #764ba2 100%);
      display: flex; align-items: center; justify-content: center;
      padding: calc(1rem + var(--safe-top)) 1rem calc(1rem + var(--safe-bottom));
      -webkit-font-smoothing: antialiased;
    }
    .login-wrap {
      width: 100%; max-width: 420px;
    }
    .card {
      border: none; border-radius: 1.25rem;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
      overflow: hidden;
    }
    .card-top {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 2rem 1.5rem 1.75rem; text-align: center; color: #fff;
    }
    .card-top .icon {
      width: 64px; height: 64px; margin: 0 auto .75rem;
      background: rgba(255,255,255,.2); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.7rem;
    }
    .card-top h5 { font-weight: 700; margin: 0; font-size: 1.15rem; }
    .card-top p  { margin: .3rem 0 0; opacity: .8; font-size: .88rem; }
    .card-body { padding: 1.75rem 1.5rem; }

    .form-label { font-weight: 500; color: #374151; font-size: .9rem; margin-bottom: .35rem; }
    .form-control {
      min-height: 48px; border-radius: .75rem;
      font-size: .95rem; border-color: #e2e8f0;
    }
    .form-control:focus { border-color: #764ba2; box-shadow: 0 0 0 .2rem rgba(118,75,162,.2); }
    .input-group .form-control { border-radius: 0 .75rem .75rem 0; }
    .input-group-text {
      background: #f8fafc; border-color: #e2e8f0;
      border-radius: .75rem 0 0 .75rem; color: #94a3b8;
      min-width: 44px; justify-content: center;
    }
    .input-group .btn { border-radius: 0 .75rem .75rem 0; min-height: 48px; }

    .btn-main {
      width: 100%; min-height: 50px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none; color: #fff; font-weight: 600; font-size: .98rem;
      border-radius: .875rem; transition: opacity .2s, transform .1s;
    }
    .btn-main:hover { opacity: .9; color: #fff; }
    .btn-main:active { transform: scale(.98); color: #fff; }

    .divider {
      display: flex; align-items: center; gap: .75rem;
      color: #9ca3af; font-size: .82rem; margin: 1.25rem 0;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: #e5e7eb;
    }
    .btn-register {
      width: 100%; min-height: 48px;
      border: 1.5px solid #e2e8f0; border-radius: .875rem;
      color: #374151; font-size: .92rem; font-weight: 500;
      background: #fff; transition: border-color .2s, background .2s;
    }
    .btn-register:hover { border-color: #764ba2; background: #faf5ff; }
  </style>
</head>
<body>

<div class="login-wrap">
  <div class="card">
    <div class="card-top">
      <div class="icon"><i class="bi bi-person-circle"></i></div>
      <h5>欢迎回来</h5>
      <p>登录以管理您的任务</p>
    </div>
    <div class="card-body">
      {% if error %}
        <div class="alert alert-danger d-flex align-items-center py-2 mb-3" style="border-radius:.75rem;font-size:.88rem">
          <i class="bi bi-exclamation-circle me-2 flex-shrink-0"></i>{{ error }}
        </div>
      {% endif %}

      <form method="POST" action="{{ url_for('client.login') }}" autocomplete="on">
        <div class="mb-3">
          <label class="form-label">用户名</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" name="username" class="form-control"
                   placeholder="请输入用户名" autocomplete="username" required>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label">密码</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" class="form-control"
                   id="pwd" placeholder="请输入密码" autocomplete="current-password" required>
            <button class="btn btn-outline-secondary" type="button" onclick="togglePwd()">
              <i class="bi bi-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-main">
          <i class="bi bi-box-arrow-in-right me-1"></i>登录
        </button>
      </form>

      <div class="divider"><span>还没有账号？</span></div>
      <a href="{{ url_for('client.register') }}" class="btn btn-register">
        <i class="bi bi-person-plus me-1"></i>立即注册
      </a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function togglePwd() {
    const input = document.getElementById('pwd');
    const icon  = document.getElementById('eyeIcon');
    input.type = input.type === 'password' ? 'text' : 'password';
    icon.className = input.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
  }
</script>
</body>
</html>
