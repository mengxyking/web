{% extends "base.html" %}
{% block title %}添加账号{% endblock %}
{% block page_title %}<i class="bi bi-person-plus me-2"></i>添加账号{% endblock %}

{% block content %}

<nav aria-label="breadcrumb" class="mb-3">
  <ol class="breadcrumb" style="font-size:.85rem">
    <li class="breadcrumb-item"><a href="{{ url_for('admin.accounts') }}" class="text-success">账号管理</a></li>
    <li class="breadcrumb-item active">添加账号</li>
  </ol>
</nav>

<div class="card" style="max-width:480px;width:100%">
  <div class="card-header"><i class="bi bi-person-plus me-2"></i>新建管理员账号</div>
  <div class="card-body">
    {% if error %}
    <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label fw-600">用户名</label>
        <input type="text" name="username" class="form-control" required
               placeholder="请输入用户名" autocomplete="off">
      </div>
      <div class="mb-3">
        <label class="form-label fw-600">密码</label>
        <input type="password" name="password" class="form-control" required
               placeholder="至少 6 位" autocomplete="new-password">
      </div>
      <div class="mb-4">
        <label class="form-label fw-600">角色</label>
        <select name="role" class="form-select">
          <option value="admin" selected>普通管理员（只能查看分配的产品）</option>
          <option value="super">超级管理员（可查看所有产品、管理账号）</option>
        </select>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success">
          <i class="bi bi-check-lg me-1"></i>创建账号
        </button>
        <a href="{{ url_for('admin.accounts') }}" class="btn btn-outline-secondary">取消</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
